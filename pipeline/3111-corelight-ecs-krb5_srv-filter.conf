# Corelight ECS Logstash Pipeline
# Git Repository: https://github.com/corelight/ecs-logstash-mappings
# Authors: Corelight Inc, Brasi Tech LLC
# License: BSD 3-Clause
# Support: https://github.com/corelight/ecs-logstash-mappings/issues/new
# Releases: https://github.com/corelight/ecs-logstash-mappings/releases

filter {
  if [@metadata][z_no_reuse][event_type] == "corelight" and [labels][corelight][event_sub_type] == "krb5-srv" {

    mutate {
      update => {
        "[event][kind]" => "event"
        "[event][category]" => "network"
        "[event][type]" => [ "connection", "info", "protocol" ]
        "[labels][corelight][event_category]" => "network_protocols"
        "[@metadata][temporary_metadata_index_name_type]" => "VAR_CL_DS_TYPE_PROTOCOL_LOG"
        "[@metadata][temporary_metadata_index_name_dataset_prefix]" => "VAR_CL_DS_PREFIX_PROTOCOL_LOG"
        "[@metadata][temporary_metadata_index_name_dataset_suffix]" => "VAR_CL_DS_SUFFIX_PROTOCOL_LOG_VARIOUS"
        "[@metadata][temporary_metadata_index_name_namespace]" => "VAR_CL_DS_NAMESPACE_PROTOCOL_LOG"
      }
      rename => {
        "service" => "[kerberos][ticket][service]"
        "realm" => "[kerberos][ticket][realm]"
        "error_code" => "[kerberos][error_code]"
        "renewal_time" => "[kerberos][ticket][renewal_time]"    
        "cipher_req" => "[kerberos][request][ticket][cipher_requested]"
        "cipher_rep" => "[kerberos][request][ticket][cipher_negotiated]"
        "padata_hash" => "[kerberos][request][ticket][hash][sha256]"
        "ticket_hash" => "[kerberos][response][ticket][hash][sha256]"
        "renew" => "[kerberos][request][ticket][renew]"
        "renewable" => "[kerberos][request][ticket][renewable]"
      }
      copy => {
        "[kerberos][request][client]" => "[source][user][name]"
      }
      add_field => {
        "[@metadata][etl][pipeline]" => "filter-mutate-2e825587cd7d-2026992201"
      }
      tag_on_failure => "_mutate_error-2e825587cd7d"
      id => "filter-mutate-2e825587cd7d"
    }
  }
}